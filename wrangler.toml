# Your Worker, on YOUR Cloudflare account. Nothing here is a secret; secrets go in
# `npx wrangler secret put NAME` (or .dev.vars locally, which you must not commit).
name = "x402-resell-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Your bundles. The Deploy to Cloudflare button creates this namespace for you and fills in the id;
# by hand: `npx wrangler kv namespace create BUNDLES` and paste its id here.
[[kv_namespaces]]
binding = "BUNDLES"
id = "replace-with-your-kv-namespace-id"

# Your receiving wallet, PAY_TO, is not in [vars]: the Deploy to Cloudflare page asks for it (from
# .dev.vars.example), or set it by hand with `npx wrangler secret put PAY_TO` (locally: .dev.vars).
# It is a public address, kept like a secret only so the one-click flow can ask for it; a var of the
# same name here would override what you entered.
[vars]
# What one bundle read costs. Keep it above what the bundle cost you, divided by the reads you expect.
PRICE_USDC = "0.02"
# Test on Base Sepolia first; switch to "eip155:8453" for real money.
NETWORK = "eip155:84532"
# At most 400 characters: payers echo it back inside each payment and the facilitator refuses a
# longer one, so every sale would fail. The Worker refuses to serve past 400.
DESCRIPTION = "Curated JSON bundles from several x402 sources, one call each."
# Optional but needed for the x402 Bazaar: the topic a bare GET /bundle serves. Coinbase lists
# /bundle without its query, and only if that answers 402 unpaid (unset = 404, never listed).
# DEFAULT_TOPIC = "base-usdc-daily"
# Optional: your own paying wallets, comma-separated. Reads they pay for (tests, listing payments)
# are never counted as sales in GET /stats (README, step 7).
# OWN_WALLETS = "0xYourOtherWallet"
# Optional: web origins whose pages may pay from a browser wallet, comma-separated (unset = no CORS).
# CORS_ORIGINS = "https://app.makememoneynomistakes.ai"
# Optional (v2): the name on your row at makememoneynomistakes.ai/results, up to 24 letters, digits, spaces
# and . _ ' -. Rows never show an address; without a name yours reads "Seller N".
# DISPLAY_NAME = "Night Owl Data"
# Where the kit reads its fee terms and registers (README, "The fee"). Leave it alone.
# MMNM_ORIGIN = "https://makememoneynomistakes.ai"
